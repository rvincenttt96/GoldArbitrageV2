[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "DTZ", "S", "RUF", "PL", "UP", "SIM"]
ignore = [
    # Persian appears in docstrings and comments; the "ambiguous character"
    # check is meant for homoglyph attacks in identifiers, not prose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # asserts are how tests assert
    "PLR2004",  # a literal expectation is the entire point of a test
]
"scripts/*" = [
    "S507",  # one known host on a link that is rebuilt often; pinning it would
             # only produce a stale key to clear by hand
    "S108",  # a scratch path on a single-tenant box
]
